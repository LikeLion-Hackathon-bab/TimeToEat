# HTTP -> HTTPS 리다이렉트 + 인증서 발급용
server {
    listen 80;
    server_name babmuckdang.site www.babmuckdang.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 프록시
server {
    listen 443 ssl http2;
    server_name babmuckdang.site www.babmuckdang.site;

    ssl_certificate     /etc/letsencrypt/live/babmuckdang.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babmuckdang.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # (선택) 도커 DNS를 직접 지정하고 싶다면 주석 해제
    # resolver 127.0.0.11 ipv6=off valid=10s;

    # 업스트림: 도커 네트워크의 백엔드 서비스
    set $upstream http://application:8080;

    # 공통 포워딩 헤더 값
    map $host   $forwarded_host  { default $host; }
    map $scheme $forwarded_proto { default $scheme; }
    set $forwarded_port 443;

    # Swagger UI 진입점 리다이렉트(springdoc 최신 경로)
    location = /swagger-ui.html {
        return 301 /swagger-ui/index.html;
    }

    # Swagger UI 정적 자원
    location /swagger-ui/ {
        proxy_pass $upstream;  # ← 경로를 붙이지 않는다
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_redirect off;
    }

    # OpenAPI 문서
    location = /v3/api-docs/ { return 301 /v3/api-docs; }
    location /v3/api-docs {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_redirect off;
    }

    # OAuth2 콜백 등
    location /oauth2/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_redirect off;
    }

    location /login/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_redirect off;
    }

    # 그 외 모든 요청
    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_redirect off;
    }
}
