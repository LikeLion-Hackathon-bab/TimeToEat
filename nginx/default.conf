# HTTP (port 80) -> HTTPS 리다이렉트
server {
    listen 80;
    server_name babmuckdang.site www.babmuckdang.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (port 443) 실제 서비스
server {
    listen 443 ssl;
    server_name babmuckdang.site www.babmuckdang.site;

    ssl_certificate /etc/letsencrypt/live/babmuckdang.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babmuckdang.site/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://application:8080;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}