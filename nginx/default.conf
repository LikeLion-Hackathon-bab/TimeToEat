server {
    listen 80;
    server_name babmuckdang.site www.babmuckdang.site;

    # Certbot 갱신을 위한 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 HTTP 요청은 HTTPS로 보냄
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (port 443) 실제 서비스
server {
    listen 443 ssl;
    server_name babmuckdang.site www.babmuckdang.site;

    # --- SSL 인증서 설정 ---
    ssl_certificate /etc/letsencrypt/live/babmuckdang.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babmuckdang.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 프록시 설정 ---
    # OAuth2 로그인 시작 경로
    location /oauth2/ {
        proxy_pass         http://application:8080/oauth2/;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 로그인 콜백 경로 (필요 시)
    location /login/ {
        proxy_pass         http://application:8080/login/;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 그 외 모든 요청
    location / {
        proxy_pass         http://application:8080;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}