server {
    listen 80;
    server_name babmuckdang.site www.babmuckdang.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;  # ← http2 권장
    server_name babmuckdang.site www.babmuckdang.site;

    ssl_certificate     /etc/letsencrypt/live/babmuckdang.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babmuckdang.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 공통 헤더 세트(편의용)
    set $upstream http://application:8080;

    # 재사용할 프록시 헤더들
    map $host $forwarded_host { default $host; }
    map $scheme $forwarded_proto { default $scheme; }
    # 443 고정 운영이면 그대로 443, 만약 프록시가 다른 포트면 적절히 변경
    set $forwarded_port 443;

    # Swagger UI
    location = /swagger-ui.html {
        proxy_pass $upstream/swagger-ui.html;
        proxy_set_header Host                $forwarded_host;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $forwarded_proto;
        proxy_set_header X-Forwarded-Host    $forwarded_host;
        proxy_set_header X-Forwarded-Port    $forwarded_port;
        proxy_redirect off;
    }
    location /swagger-ui/ {
        proxy_pass $upstream/swagger-ui/;
        proxy_set_header Host                $forwarded_host;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $forwarded_proto;
        proxy_set_header X-Forwarded-Host    $forwarded_host;
        proxy_set_header X-Forwarded-Port    $forwarded_port;
        proxy_redirect off;
    }

    location = /v3/api-docs/ { return 301 /v3/api-docs; }
    location /v3/api-docs {
        proxy_pass $upstream;
        proxy_set_header Host                $forwarded_host;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $forwarded_proto;
        proxy_set_header X-Forwarded-Host    $forwarded_host;
        proxy_set_header X-Forwarded-Port    $forwarded_port;
        proxy_redirect off;
    }

    location /oauth2/ {
        proxy_pass $upstream/oauth2/;
        proxy_set_header Host                $forwarded_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $forwarded_proto;
        proxy_set_header X-Forwarded-Host    $forwarded_host;
        proxy_set_header X-Forwarded-Port    $forwarded_port;
        proxy_redirect off;
    }

    location /login/ {
        proxy_pass $upstream/login/;
        proxy_set_header Host                $forwarded_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $forwarded_proto;
        proxy_set_header X-Forwarded-Host    $forwarded_host;
        proxy_set_header X-Forwarded-Port    $forwarded_port;
        proxy_redirect off;
    }

    location / {
        proxy_pass $upstream;
        proxy_set_header Host                $forwarded_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $forwarded_proto;
        proxy_set_header X-Forwarded-Host    $forwarded_host;
        proxy_set_header X-Forwarded-Port    $forwarded_port;
        proxy_redirect off;
    }
}
