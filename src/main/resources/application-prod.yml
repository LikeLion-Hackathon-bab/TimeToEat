spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true


  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${CLIENT_REDIRECT_PATH}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 새 카카오 앱은 account_email이 "권한 없음"이라 요청하면 KOE205. 이메일 동의가 열린 앱이면 KAKAO_SCOPE에 더한다.
            scope: ${KAKAO_SCOPE:profile_nickname,profile_image}
            provider: kakao

springdoc:
  server-url: https://babmuckdang.site

app:
  ai:
    food-base-url: ${FOOD_AI_BASE_URL:http://food-ai:8000}
    reco-base-url: ${RECO_AI_BASE_URL:http://recommend-ai:8010}
    taste-base-url: ${TASTE_BASE_URL:http://taste-service:8020}
    outbound-key: ${AI_OUTBOUND_KEY:prod-ai-key-xxx}
    timeout-millis: ${AI_HTTP_TIMEOUT_MILLIS:3000}

logging:
  level:
    org.hibernate.SQL: debug
