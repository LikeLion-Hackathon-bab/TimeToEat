server:
  port: 8080
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: prod

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

logging:
  level:
    org.hibernate.SQL: debug


management:
  metrics:
    enable:
      process.cpu: false

matching:
  socket-base-url: ${SOCKET_BASE_URL:http://socket:3000}

# API 문서(Swagger UI·/v3/api-docs)는 기본으로 끈다. 운영에 공개하면 전체 API 목록이 노출된다.
# 로컬·시험 서버에서만 SWAGGER_ENABLED=true 로 켠다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# 시연 로그인(카카오 계정 없이 시연 회원 5명). 기본 꺼짐 → /api/v1/auth/demo-login 404.
# 켤 때: DEMO_LOGIN_ENABLED=true, DEMO_LOGIN_SECRET(32자 이상), 선택 DEMO_LOGIN_UNTIL(ISO 시각, 지나면 자동 꺼짐).
demo-login:
  enabled: ${DEMO_LOGIN_ENABLED:false}
  secret: ${DEMO_LOGIN_SECRET:}
  until: ${DEMO_LOGIN_UNTIL:}
