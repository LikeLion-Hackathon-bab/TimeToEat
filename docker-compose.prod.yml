services:
  application:
    image: choikang7157/timetoeat-server:latest
    container_name: timetoeat-application
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      food-ai:
        condition: service_started
      socket:
        condition: service_started
    ports:
      - "8080:8080"
    networks: [ my-network ]

  mysql:
    image: mysql:8.0
    container_name: timetoeat-mysql
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: [ "3307:3306" ]
    volumes: [ mysql_data:/var/lib/mysql ]
    networks: [ my-network ]

  redis:
    image: redis:7-alpine
    container_name: timetoeat-redis
    restart: always
    ports: [ "6379:6379" ]
    volumes: [ redis_data:/data ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ my-network ]

  nginx:
    image: nginx:latest
    container_name: timetoeat-nginx
    restart: always
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - application
    networks: [ my-network ]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: timetoeat-rabbitmq
    env_file:
      - .env
    ports: [ "5672:5672", "15672:15672" ]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes: [ rabbitmq_data:/var/lib/rabbitmq ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running", "-q" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ my-network ]

  food-ai:
    image: gosua/food-ai:1.3.4
    container_name: food-ai
    networks: [ my-network ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || curl -fsS http://127.0.0.1:8000/health || wget -qO- http://127.0.0.1:8000/healthz || wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  socket:
    image: dae9utang/babmukdang-socket:v1.0.0
    container_name: babmukdang-socket
    restart: always
    ports:
      - "3000:3000"
    networks: [ my-network ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\" || node -e \"require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

networks:
  my-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
